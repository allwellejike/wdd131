<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Allwell">
    <meta name="description" content="Product Review Form for WDD 131 assignment">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
<header>
    <h1>Product Review Form</h1>
</header>

<main>
    <form id="reviewForm" method="get" action="review.html">
        <!-- Product Name -->
        <label for="product">Product Name *</label>
        <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
            <!-- Options populated by JS -->
        </select>

        <!-- Overall Rating -->
        <fieldset>
            <legend>Overall Rating *</legend>
            <label><input type="radio" name="rating" value="1" required>☆ 1</label>
            <label><input type="radio" name="rating" value="2" required>☆ 2</label>
            <label><input type="radio" name="rating" value="3" required>☆ 3</label>
            <label><input type="radio" name="rating" value="4" required>☆ 4</label>
            <label><input type="radio" name="rating" value="5" required>☆ 5</label>
        </fieldset>

        <!-- Date of Installation -->
        <label for="installDate">Date of Installation *</label>
        <input type="date" id="installDate" name="installDate" required>

        <!-- Useful Features -->
        <fieldset>
            <legend>Useful Features</legend>
            <label><input type="checkbox" name="feature" value="Ease of Use"> Ease of Use</label>
            <label><input type="checkbox" name="feature" value="Performance"> Performance</label>
            <label><input type="checkbox" name="feature" value="Design"> Design</label>
            <label><input type="checkbox" name="feature" value="Value"> Value</label>
        </fieldset>

        <!-- Written Review -->
        <label for="review">Written Review</label>
        <textarea id="review" name="review" rows="4"></textarea>

        <!-- User Name -->
        <label for="username">Your Name</label>
        <input type="text" id="username" name="username">

        <!-- Submit -->
        <input type="submit" value="Submit Review">
    </form>
</main>

<footer>
    <p>&copy; 2026 Allwell</p>
</footer>

<script src="scripts/form.js"></script>
</body>
</html>
