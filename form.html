<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Allwell Ejike">
    <meta name="description" content="Fill out the product review form to submit ratings, features, and feedback for selected tech products in WDD 131.">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
<header>
    <h1>Product Review Form</h1>
</header>

<main>
    <form id="reviewForm" method="get" action="review.html">
        <!-- Product Name -->
        <label for="product">Product Name *</label>
        <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
            <!-- Options populated by JS -->
        </select>

        <!-- Overall Rating -->
        <fieldset>
            <legend>Overall Rating *</legend>
            <input type="radio" id="rating1" name="rating" value="1" required><label for="rating1">☆ 1</label>
            <input type="radio" id="rating2" name="rating" value="2" required><label for="rating2">☆ 2</label>
            <input type="radio" id="rating3" name="rating" value="3" required><label for="rating3">☆ 3</label>
            <input type="radio" id="rating4" name="rating" value="4" required><label for="rating4">☆ 4</label>
            <input type="radio" id="rating5" name="rating" value="5" required><label for="rating5">☆ 5</label>
        </fieldset>

        <!-- Date of Installation -->
        <label for="installDate">Date of Installation *</label>
        <input type="date" id="installDate" name="installDate" required>

        <!-- Useful Features -->
        <fieldset>
            <legend>Useful Features</legend>
            <input type="checkbox" id="featureEase" name="feature" value="Ease of Use"><label for="featureEase">Ease of Use</label>
            <input type="checkbox" id="featurePerformance" name="feature" value="Performance"><label for="featurePerformance">Performance</label>
            <input type="checkbox" id="featureDesign" name="feature" value="Design"><label for="featureDesign">Design</label>
            <input type="checkbox" id="featureValue" name="feature" value="Value"><label for="featureValue">Value</label>
        </fieldset>

        <!-- Written Review -->
        <label for="review">Written Review</label>
        <textarea id="review" name="review" rows="4"></textarea>

        <!-- User Name -->
        <label for="username">Your Name</label>
        <input type="text" id="username" name="username">

        <!-- Submit -->
        <input type="submit" value="Submit Review">
    </form>
</main>

<footer>
    <p>&copy; 2026 Allwell Ejike</p>
</footer>

</body>
</html>
